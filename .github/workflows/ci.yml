name: CI - Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO }}

      - name: Build Docker Image
        run: |
         docker build -t strapi:${{ github.sha }} -f Docker/Dockerfile ./Strapi


      - name: Tag Image
        run: |
          docker tag strapi:${{ github.sha }} ${{ secrets.ECR_REPO }}:${{ github.sha }}

      - name: Push Image to ECR
        run: |
          docker push ${{ secrets.ECR_REPO }}:${{ github.sha }}

      - name: Save Image Tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
